server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employee-service
              uri: http://localhost:8081
              predicates:
                - Path=/employees/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
  file:
    name: logs/api-gateway.log