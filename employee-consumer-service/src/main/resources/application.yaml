spring:
  application:
    name: employee-consumer-service

  datasource:
    url: jdbc:mysql://localhost:3306/employee_management_system?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    topic:
      employee: employee-topic

    consumer:
      group-id: employee-consumer-group-v2
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ems.consumer.event.EmployeeEvent

server:
  port: 8081

logging:
  file:
    name: logs/employee-consumer-service.log

  level:
    root: INFO